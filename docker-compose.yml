version: "3.9"

# ==============================================================================
# HẠ TẦNG CHẠY THỬ NGHIỆM PIPELINE HỘ GIA ĐÌNH - NHÂN KHẨU (HDG -> C360 -> BI & API)
# Hỗ trợ chạy theo từng Profile để tiết kiệm RAM trên máy cá nhân (16GB RAM):
# - Chỉ bật DB Oracle:       docker compose --profile db up -d
# - Bật thêm CDC (Kafka):    docker compose --profile db --profile cdc up -d
# - Bật thêm BI (Metabase):  docker compose --profile db --profile bi up -d
# - Bật toàn bộ (trên VM):   docker compose --profile all up -d
# ==============================================================================

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: hgd_oracle_db
    profiles: ["db", "cdc", "bi", "all"]
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: sys_secret_pwd
      APP_USER: VSS
      APP_USER_PASSWORD: vss_secret_pwd
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./p1_source_and_mirror:/opt/sql_init:ro
    deploy:
      resources:
        limits:
          memory: 3G

  kafka:
    image: apache/kafka:3.8.0
    container_name: hgd_kafka_kraft
    profiles: ["cdc", "all"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    deploy:
      resources:
        limits:
          memory: 1G

  debezium-connect:
    image: quay.io/debezium/connect:2.7
    container_name: hgd_debezium_connect
    profiles: ["cdc", "all"]
    depends_on:
      - kafka
      - oracle-db
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      HEAP_OPTS: "-Xms512M -Xmx1G"
    deploy:
      resources:
        limits:
          memory: 1536M

  metabase:
    image: metabase/metabase:latest
    container_name: hgd_bi_metabase
    profiles: ["bi", "all"]
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    volumes:
      - metabase_data:/metabase-data
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  oracle_data:
  metabase_data:

